out_of_scope_requirements:
- id: 11.x (excluding 11.6.1)
  title: Test security of systems and networks regularly
  rationale: 'PCI 11.x covers runtime vulnerability scanning (internal/external scans 11.2, ASV, penetration testing 11.3, IDS 11.4/11.5). IaC scanners cannot evaluate running-system posture, so we exclude
    this family and rely on the runtime controls listed under evidence_link. Note: 11.6.1 (change- and tamper-detection mechanism for payment-page HTTP headers and content) became MANDATORY on 31 March 2025
    and is re-anchored as an in-scope IaC row above.'
  control_owner: Security team -- Vulnerability Management
  approved_on: '2026-08-01'
  expires_on: '2027-08-01'
  evidence_link: https://www.pcisecuritystandards.org/document_library/
- id: 6.2.4
  title: Software-engineering techniques for secure development
  rationale: 'PCI SSC 6.2.4 enumerates software-engineering techniques (threat modeling, code review, secure coding standards) for in-house custom software. These are PROCESS controls exercised
    by the development team''s SDLC, not artifacts of any Terraform module. IaC scanning cannot validate them. The v4.0.1 re-anchoring moved the related CKV_AZURE_* rules (web app client cert / TLS / FTPS)
    into the in-scope 6.4.2 (TLS minimum version for public-facing apps) and 6.4.3 (attack-prevention automation) rows above.'
  control_owner: Engineering -- Application Security team + Security Engineering (joint)
  approved_on: '2026-08-01'
  expires_on: '2027-08-01'
  evidence_link: https://www.pcisecuritystandards.org/document_library/
- id: 12.x
  title: Support information security with organizational policies and programs
  rationale: 'PCI 12.x is policy and process. v4.0.1 sub-reqs most relevant to IaC scope: 12.10.4 (incident response training, "effective immediately for all v4.0 assessments" per PCI SSC Summary-of-Changes
    v3.2.1->v4.0 PDF line 1398, pulled Aug 4 2026); 12.10.4.1 (training frequency via targeted risk analysis); 12.10.5 (incident response plan covers monitoring and responding to alerts from security monitoring
    systems, SoC PDF line 1207 -- NOT "incident response training", which is 12.10.4). All 12.x sub-reqs are organizational controls (HR, CISO, GRC, training program) not artifacts of any Terraform module.
    IaC scanning cannot validate them. A separate runbook subsection documents the 12.10.4 vs 12.10.5 mapping for the operator.'
  control_owner: Security team -- GRC + Human Resources (training delivery)
  approved_on: '2026-08-01'
  expires_on: '2027-08-01'
  evidence_link: https://www.pcisecuritystandards.org/document_library/
- id: 9.x
  title: Restrict physical access to cardholder data
  rationale: PCI 9.x covers physical access to cardholder-data areas. Azure datacenters are vendor-managed; physical access controls for the cloud-tier live with Microsoft under their SOC 2 / ISO 27001
    attestations (inherited via the customer DPA). For the customer-premises tier (offices, badge readers, on-premises backups), physical controls live with the Facilities + M365 teams. IaC scanning cannot
    validate either tier.
  control_owner: Azure datacenter operator (Microsoft) -- inherited via DPA; Facilities + M365 teams -- customer-premises tier
  approved_on: '2026-08-01'
  expires_on: '2027-08-01'
  evidence_link: https://learn.microsoft.com/en-us/azure/compliance/offerings/offering-pci-dss
- id: 6.3.2
  title: Inventory of bespoke and custom software, and third-party software components incorporated into bespoke and custom software, to facilitate vulnerability and patch management (SBOM)
  rationale: PCI 6.3.2 requires a maintained inventory of bespoke/custom software and the third-party components incorporated into it (de-facto SBOM requirement), used for vulnerability and patch management.
    SBOMs are build-time artifacts produced by CI/CD tooling (e.g., syft, cyclonedx-bom, cdxgen) -- they describe application dependencies, not Azure resource configuration. IaC scanners like Checkov parse
    Terraform source for resource-shape misconfigurations; no .tf artifact contains an SBOM or component list for a deployed application. The assessor's testing procedure 6.3.2.b is documentary, not configurational.
    This control lives with the application's build pipeline and software-engineering process, not with IaC scanning. Mandatory since 31 March 2025 per PCI SSC Summary of Changes v3.2.1 -> v4.0 PDF.
  control_owner: Engineering -- Application Security
  approved_on: '2026-08-05'
  expires_on: '2027-08-05'
  evidence_link: https://www.pcisecuritystandards.org/document_library/
- id: 8.4.2
  title: MFA is implemented for all access into the CDE
  rationale: PCI 8.4.2 requires MFA for all access into the CDE (not just admin or remote). The enforcement plane is the Identity Provider (Microsoft Entra ID Conditional Access), VPN/ZTNA, or PAM -- Terraform/IaC
    declares these resources but cannot evaluate whether an MFA challenge was actually issued at session time. Microsoft's authoritative Entra PCI guidance (https://learn.microsoft.com/en-us/entra/standards/pci-requirement-8)
    explicitly maps 8.4.2 to 'Block legacy authentication with Microsoft Entra Conditional Access,' which lives in the Entra tenant, not in AzureRM .tf files. The assessor's testing procedure 8.4.2.b ('Observe
    personnel authenticating and verify that the authentication uses MFA') is an operational observation, not a config audit. Mandatory since 31 March 2025 per PCI SSC Summary of Changes v3.2.1 -> v4.0
    PDF.
  control_owner: Identity and Access Management team
  approved_on: '2026-08-05'
  expires_on: '2027-08-05'
  evidence_link: https://learn.microsoft.com/en-us/entra/standards/pci-requirement-8
- id: 11.5.1
  title: Intrusion-detection and/or intrusion-prevention techniques to detect and/or prevent intrusions into the network
  rationale: 'PCI 11.5.1 requires intrusion-detection/intrusion-prevention techniques that monitor all traffic at the CDE perimeter and at critical points inside the CDE, alert personnel to suspected compromise,
    and keep engines/baselines/signatures up to date. This is a runtime network control exercised by NSG flow logs, Azure Firewall (IDPS mode), Microsoft Defender for Cloud, Network Watcher, and the SOC/SIEM
    platform -- not by Terraform. Microsoft''s authoritative Entra PCI guidance (https://learn.microsoft.com/en-us/entra/standards/pci-requirement-11) explicitly states 11.5.1 is ''Not applicable to Microsoft
    Entra ID'' and routes it to network/host controls. Terraform can express partial enablers (azurerm_monitor_diagnostic_setting, azurerm_network_watcher_flow_log, azurerm_firewall_policy) but the assessor''s
    testing procedures 11.5.1.b (alerting wiring) and 11.5.1.c (signature currency) require runtime evidence the scanner cannot collect. NOTE: file-integrity monitoring is a separate requirement 11.5.2,
    already covered by the existing ''11.x (excluding 11.6.1)'' OOS row above.'
  control_owner: Security team -- Network Security and SOC
  approved_on: '2026-08-05'
  expires_on: '2027-08-05'
  evidence_link: https://learn.microsoft.com/en-us/entra/standards/pci-requirement-11
- id: 10.4.1.1
  title: Automated mechanisms are used to perform audit log reviews
  rationale: PCI 10.4.1.1 requires that audit log reviews be performed by automated mechanisms (SIEM correlation rules, alerting, triage), not by humans reading raw logs. The control plane is the SIEM (Microsoft
    Sentinel on a Log Analytics workspace) plus the SOC workflow, not Terraform. Terraform can declare the enabling plumbing (azurerm_monitor_diagnostic_setting, azurerm_sentinel_onboarding, azurerm_monitor_*_alert_rule)
    but cannot evaluate whether detection rules are deployed in the SIEM or whether alerts are being triaged by personnel. Microsoft's authoritative Entra PCI guidance (https://learn.microsoft.com/en-us/entra/standards/pci-requirement-10)
    maps 10.4.1.1 to 'Configure automated actions and alerting when Microsoft Entra logs are integrated with Azure Monitor.' The assessor's testing procedure 10.4.1.1.a ('Examine documentation and interview
    personnel') is documentary. Mandatory since 31 March 2025 per PCI SSC Summary of Changes v3.2.1 -> v4.0 PDF.
  control_owner: Security team -- Security Operations Center
  approved_on: '2026-08-05'
  expires_on: '2027-08-05'
  evidence_link: https://learn.microsoft.com/en-us/entra/standards/pci-requirement-10
