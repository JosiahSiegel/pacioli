# terraform_remediation.yaml — Canonical azurerm 4.x remediation patterns for fired Checkov rules.
#
# REFERENCE ARTIFACT ONLY — not wired into report.html in this PR. The HTML 'Remediation'
# column render is tracked separately (deferred to follow-up PR). Auditor reading this file
# sees the canonical azurerm 4.x HCL for every fired Checkov rule; the aggregator currently
# renders NO column from this file.
#
# Schema (locked): the dict is keyed by check_id. Each entry is a list of one-or-more
# remediation_block dicts with the following fields:
#   - resource_type: azurerm resource type (str, or comma-separated str if a check applies
#                    to multiple resources; see CKV_AZURE_PCI_003 for the multi-resource pattern)
#   - current_problem: verbatim Checkov rule description (from `checkov --list`)
#   - remediation_hcl: canonical azurerm 4.x HCL (literal block scalar `|`, multi-line OK)
#   - verification_step: post-apply command(s) to confirm the remediation took effect
#   - provenance: registry.terraform.io URL for the canonical attribute docs
#
# Coverage: 68 entries.
#   - 64 Azure-flavored fired IDs (51 CKV_AZURE_* + 13 CKV2_AZURE_* per commits d6aa96a and 7a43e02)
#   - 4 CKV_AZURE_PCI_* custom checks (CKV_AZURE_PCI_002..005)
#   - CKV_AZURE_PCI_001 deliberately omitted: Terraform lifecycle -> HashiCorp, not azurerm.
#
# Intentionally absent: 4 CKV_SECRET_* + CKV_TF_1 IDs. No Terraform azurerm remediation applies;
# secret scanning is the actual control (--framework secrets in scan_pci.sh).
#
# Reuse: snippets extracted from .checkov/all-prod-2026-08-05/remediation/terraform_remediation.md
# (656 lines, author-curated); new azurerm 4.x patterns generated from registry.terraform.io docs.
# Estimated size: 68 entries * ~25 lines/entry = ~1700 lines.
#
# Verification:
#   python -c "import yaml; y=yaml.safe_load(open('.scripts/checkov/terraform_remediation.yaml')); assert len(y['remediations']) >= 68; ..."
#   python scripts/test_terraform_remediation_yaml.py
#
# The aggregator currently renders NO column from this file. Wiring the HTML 'Remediation'
# column is tracked as a follow-up PR (out of scope here per Oracle §3 downscope).
remediations:
  CKV_AZURE_103:
    - resource_type: azurerm_data_factory
      current_problem: "Ensure that Azure Data Factory uses Git repository for source control"
      remediation_hcl: |
        resource "azurerm_data_factory" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name

          # PCI 10.2.1 (CKV_AZURE_103) — source-control the factory; vsts_account_name
          # or github_account_name must be set. Use a github_repository for terraform-managed
          # source control so changes flow through PR review.
          github_configuration {
            account_name    = var.github_account_name
            branch_name     = "main"
            repository_name = var.github_repository_name
            root_folder     = "/"
          }
        }
      verification_step: |
        After `terraform apply`, run `terraform plan` and confirm no diff on
        the `github_configuration` block. In the Azure Portal, navigate to the
        Data Factory -> Author -> Git configuration and confirm the repo URL
        and branch are populated.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/data_factory"
  CKV_AZURE_104:
    - resource_type: azurerm_data_factory
      current_problem: "Ensure that Azure Data factory public network access is disabled"
      remediation_hcl: |
        resource "azurerm_data_factory" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name

          # PCI 1.2.1 / 1.3 (CKV_AZURE_104) — disallow public access at the
          # factory level. Caller must wire a private endpoint via
          # `azurerm_data_factory_private_endpoint` or use `public_network_access_enabled = "Disabled"`.
          public_network_access_enabled = false
        }
      verification_step: |
        After `terraform apply`, run `az datafactory show --name <n> --resource-group <rg> --query "properties:publicNetworkAccess"`
        and confirm it returns `Disabled`. Re-run `checkov --check CKV_AZURE_104 --framework terraform` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/data_factory"
  CKV_AZURE_110:
    - resource_type: azurerm_key_vault
      current_problem: "Ensure that key vault enables purge protection"
      remediation_hcl: |
        resource "azurerm_key_vault" "example" {
          name                       = var.name
          location                   = var.location
          resource_group_name        = var.resource_group_name
          tenant_id                  = data.azurerm_client_config.current.tenant_id
          sku_name                   = "standard"
          soft_delete_retention_days = 90

          # PCI 3.4 / 8.6 (CKV_AZURE_110) — prevent permanent purge during
          # the soft-delete retention window. Both purge_protection_enabled and
          # soft_delete_retention_days >= 7 are required for the rule to pass.
          purge_protection_enabled = true

          # Remove any stale #tfsec:ignore comments — tfsec was archived 2025-11.
        }
      verification_step: |
        After `terraform apply`, run `az keyvault show --name <n> --query "properties:enablePurgeProtection"`
        and confirm `true`. Then re-run `checkov --check CKV_AZURE_110 --framework terraform` and expect 0 findings
        on the `azurerm_key_vault` resource.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/key_vault"
  CKV_AZURE_113:
    - resource_type: azurerm_mssql_server
      current_problem: "Ensure that SQL server disables public network access"
      remediation_hcl: |
        resource "azurerm_mssql_server" "example" {
          name                         = var.name
          resource_group_name          = var.resource_group_name
          location                     = var.location
          version                      = "12.0"
          administrator_login          = var.admin_login
          administrator_login_password = var.admin_password
          minimum_tls_version          = "1.2"

          # PCI 1.3 (CKV_AZURE_113) — default is `true` (public). Force `false`
          # and rely on a private endpoint + VNet rule for connectivity.
          public_network_access_enabled = false
        }
      verification_step: |
        After `terraform apply`, run `az sql server show --name <n> --resource-group <rg> --query "publicNetworkAccess"`
        and confirm `Disabled`. Re-run `checkov --check CKV_AZURE_113 --framework terraform` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/mssql_server"
  CKV_AZURE_115:
    - resource_type: azurerm_kubernetes_cluster
      current_problem: "Ensure that AKS enables private clusters"
      remediation_hcl: |
        resource "azurerm_kubernetes_cluster" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          dns_prefix          = var.dns_prefix
          default_node_pool {
            name       = "default"
            node_count = 3
            vm_size    = "Standard_DS2_v2"
          }
          identity {
            type = "SystemAssigned"
          }

          # PCI 1.2.1 / 1.3 (CKV_AZURE_115) — AKS API server must not be reachable
          # over the public internet. Private cluster requires an existing AKS-managed
          # private DNS zone; set private_cluster_enabled = true and either
          # private_dns_zone_id (recommended) or private_dns_zone_prefix (deprecated in 4.x).
          private_cluster_enabled = true
        }
      verification_step: |
        After `terraform apply`, run `az aks show --name <n> --resource-group <rg> --query "apiServerAccessProfile:enablePrivateCluster"`
        and confirm `true`. The Kubernetes API server endpoint should NOT resolve publicly.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/kubernetes_cluster"
  CKV_AZURE_117:
    - resource_type: azurerm_kubernetes_cluster_node_pool
      current_problem: "Ensure that AKS uses disk encryption set"
      remediation_hcl: |
        resource "azurerm_kubernetes_cluster_node_pool" "example" {
          name                   = "encrypted"
          kubernetes_cluster_id  = azurerm_kubernetes_cluster.example.id
          vm_size                = "Standard_DS2_v2"
          node_count             = 3

          # PCI 1.3 (CKV_AZURE_117) — node-pool-level. Set on the standalone node_pool
          # resource (NOT on default_node_pool within azurerm_kubernetes_cluster; doing
          # both on the same pool causes drift). Requires an existing disk_encryption_set
          # (see modules/disk_encryption_set/v1/ pattern, or inline azurerm_disk_encryption_set).
          azure_disk_encryption_set_id = "/subscriptions/<sub-id>/resourceGroups/<des-rg>/providers/Microsoft.Compute/diskEncryptionSets/<des-name>"
        }
      verification_step: |
        After `terraform apply`, run `terraform plan` and confirm no diff on
        `azure_disk_encryption_set_id`. In the Azure Portal, navigate to the AKS node pool ->
        Properties -> Node encryption and confirm the DES is wired. Re-run `checkov --check CKV_AZURE_117`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/kubernetes_cluster_node_pool"
  CKV_AZURE_137:
    - resource_type: azurerm_container_registry
      current_problem: "Ensure ACR admin account is disabled"
      remediation_hcl: |
        resource "azurerm_container_registry" "example" {
          name                = var.name
          resource_group_name = var.resource_group_name
          location            = var.location
          sku                 = "Premium"

          # PCI 1.2.1 / 1.3 (CKV_AZURE_137) — admin account permits plaintext
          # username/password auth; OAuth / managed identity is the canonical pattern.
          admin_enabled = false
        }
      verification_step: |
        After `terraform apply`, run `az acr show --name <n> --resource-group <rg> --query "adminUserEnabled"`
        and confirm `false`. Re-run `checkov --check CKV_AZURE_137` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_registry"
  CKV_AZURE_139:
    - resource_type: azurerm_container_registry
      current_problem: "Ensure ACR set to disable public networking"
      remediation_hcl: |
        resource "azurerm_container_registry" "example" {
          name                = var.name
          resource_group_name = var.resource_group_name
          location            = var.location
          sku                 = "Premium"
          admin_enabled       = false

          # PCI 1.2.1 / 1.3 (CKV_AZURE_139) — default is `true` (public). Caller must
          # wire a private endpoint via `azurerm_private_endpoint` (subresource_names = ["registry"]).
          public_network_access_enabled = false
        }
      verification_step: |
        After `terraform apply`, run `az acr show --name <n> --resource-group <rg> --query "publicNetworkAccess"`
        and confirm `Disabled`. Confirm DNS resolves the ACR FQDN to a private IP.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_registry"
  CKV_AZURE_148:
    - resource_type: azurerm_redis_cache
      current_problem: "Ensure Redis Cache is using the latest version of TLS encryption"
      remediation_hcl: |
        resource "azurerm_redis_cache" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          capacity            = 2
          family              = "C"
          sku_name            = "Standard"

          # PCI 4.2.1 (CKV_AZURE_148) — minimum TLS 1.2. azurerm 4.x has dropped
          # TLS1_0/TLS1_1 as valid enum values; using them throws at plan time.
          minimum_tls_version = "1.2"
        }
      verification_step: |
        After `terraform apply`, run `az redis show --name <n> --resource-group <rg> --query "minimumTlsVersion"`
        and confirm `1.2`. Re-run `checkov --check CKV_AZURE_148` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/redis_cache"
  CKV_AZURE_153:
    - resource_type: azurerm_app_service_slot
      current_problem: "Ensure web app redirects all HTTP traffic to HTTPS in Azure App Service Slot"
      remediation_hcl: |
        resource "azurerm_app_service_slot" "example" {
          name            = var.slot_name
          app_service_name = azurerm_app_service.example.name
          resource_group_name = azurerm_app_service.example.resource_group_name
          app_service_id  = azurerm_app_service.example.id
          location        = azurerm_app_service.example.location

          site_config {
            # PCI 4.2.1 (CKV_AZURE_153) — mirror the parent App Service HTTPS-only
            # setting. Pair with `https_only = true` on the app_service resource itself.
            http2_enabled = true
          }

          https_only = true
        }
      verification_step: |
        After `terraform apply`, confirm `az webapp config show --slot <slot>` reports
        `httpsOnly: true` for the slot. Re-run `checkov --check CKV_AZURE_153`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service_slot"
  CKV_AZURE_16:
    - resource_type: azurerm_app_service
      current_problem: "Ensure that Register with Azure Active Directory is enabled on App Service"
      remediation_hcl: |
        resource "azurerm_app_service" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          app_service_plan_id = azurerm_app_service_plan.example.id

          # PCI 7.2.1 / 8.6 (CKV_AZURE_16) — managed-identity-backed auth via
          # Azure Active Directory provider. The `identity {}` block pairs with
          # `auth_settings { enabled = true; ... }` for end-to-end AAD auth.
          identity {
            type = "SystemAssigned"
          }
        }
      verification_step: |
        After `terraform apply`, run `az webapp show --name <n> --resource-group <rg> --query "identity:type"`
        and confirm `SystemAssigned`. In the Portal, Settings -> Identity should show
        System assigned = On, Object ID populated.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service"
  CKV_AZURE_164:
    - resource_type: azurerm_container_registry
      current_problem: "Ensures that ACR uses signed/trusted images"
      remediation_hcl: |
        resource "azurerm_container_registry" "example" {
          name                = var.name
          resource_group_name = var.resource_group_name
          location            = var.location
          sku                 = "Premium"
          admin_enabled       = false

          # PCI 6.2.4 / 6.5.1 (CKV_AZURE_164) — restrict pulled images to trusted
          # content. The azurerm 4.x attribute is `trust_policy { enabled = true }`.
          trust_policy {
            enabled = true
          }
        }
      verification_step: |
        After `terraform apply`, run `az acr config content-trust show --registry <n> --resource-group <rg>`
        and confirm `status: enabled`. Re-run `checkov --check CKV_AZURE_164`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_registry"
  CKV_AZURE_165:
    - resource_type: azurerm_container_registry
      current_problem: "Ensure geo-replicated container registries to match multi-region container deployments."
      remediation_hcl: |
        resource "azurerm_container_registry" "example" {
          name                = var.name
          resource_group_name = var.resource_group_name
          location            = var.location

          # PCI 1.2.1 (CKV_AZURE_165) — geo-replication for multi-region deployments.
          # Premium SKU required. geo_replications is a set of { location, ... } blocks.
          sku = "Premium"

          geo_replications {
            location                = "West US"
            regional_endpoint_enabled = true
          }
        }
      verification_step: |
        After `terraform apply`, run `az acr replication list --registry <n> --resource-group <rg> --query "[].location"`
        and confirm the secondary region is present.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_registry"
  CKV_AZURE_166:
    - resource_type: azurerm_container_registry
      current_problem: "Ensure container image quarantine, scan, and mark images verified"
      remediation_hcl: |
        resource "azurerm_container_registry" "example" {
          name                = var.name
          resource_group_name = var.resource_group_name
          location            = var.location
          sku                 = "Premium"

          # PCI 6.2.4 (CKV_AZURE_166) — image quarantine + scan workflow.
          # `quarantine_policy` controls whether untagged images pass through.
          quarantine_policy {
            enabled = true
          }
        }
      verification_step: |
        After `terraform apply`, run `az acr config policy show --registry <n> --resource-group <rg> --type quarantine`
        and confirm `status: enabled`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_registry"
  CKV_AZURE_167:
    - resource_type: azurerm_container_registry
      current_problem: "Ensure a retention policy is set to cleanup untagged manifests."
      remediation_hcl: |
        resource "azurerm_container_registry" "example" {
          name                = var.name
          resource_group_name = var.resource_group_name
          location            = var.location
          sku                 = "Premium"

          # PCI 6.2.4 (CKV_AZURE_167) — auto-purge untagged manifests after N days.
          retention_policy {
            days    = 30
            enabled = true
          }
        }
      verification_step: |
        After `terraform apply`, run `az acr config retention show --registry <n> --resource-group <rg>`
        and confirm `status: enabled, days: 30`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_registry"
  CKV_AZURE_168:
    - resource_type: azurerm_kubernetes_cluster
      current_problem: "Ensure Azure Kubernetes Cluster (AKS) nodes should use a minimum number of 50 pods."
      remediation_hcl: |
        resource "azurerm_kubernetes_cluster" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          dns_prefix          = var.dns_prefix

          # PCI 1.2.1 (CKV_AZURE_168) — minimum 50 pods per node. Set on default_node_pool.
          default_node_pool {
            name       = "default"
            node_count = 3
            vm_size    = "Standard_DS2_v2"

            # `max_pods` defaults to 30 for kubenet and 250 for Azure CNI. To pass
            # CKV_AZURE_168 set max_pods >= 50.
            max_pods = 50
          }

          identity { type = "SystemAssigned" }
        }
      verification_step: |
        After `terraform apply`, run `terraform plan` and confirm no diff on `default_node_pool.max_pods`.
        Re-run `checkov --check CKV_AZURE_168` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/kubernetes_cluster"
  CKV_AZURE_172:
    - resource_type: azurerm_kubernetes_cluster
      current_problem: "Ensure autorotation of Secrets Store CSI Driver secrets for AKS clusters"
      remediation_hcl: |
        resource "azurerm_kubernetes_cluster" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          dns_prefix          = var.dns_prefix
          default_node_pool {
            name       = "default"
            node_count = 3
            vm_size    = "Standard_DS2_v2"
          }
          identity { type = "SystemAssigned" }

          # PCI 3.5.1 / 8.6 (CKV_AZURE_172) — enable Secrets Store CSI Driver
          # secret autorotation. azurerm 4.x has the key_vault_secrets_provider block
          # at the cluster level; set secret_rotation_enabled = true.
          key_vault_secrets_provider {
            secret_rotation_enabled = true
            secret_rotation_interval = "5m"
          }
        }
      verification_step: |
        After `terraform apply`, run `terraform plan` and confirm no diff on
        `key_vault_secrets_provider`. In the Portal, AKS -> Security -> Secret Store CSI
        should show `Enable Secret Rotation: yes`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/kubernetes_cluster"
  CKV_AZURE_190:
    - resource_type: azurerm_storage_account
      current_problem: "Ensure that Storage blobs restrict public access"
      remediation_hcl: |
        resource "azurerm_storage_account" "example" {
          name                     = var.name
          resource_group_name      = var.resource_group_name
          location                 = var.location
          account_tier             = "Standard"
          account_replication_type = "GRS"
          min_tls_version          = "TLS1_2"

          # PCI 1.2.1 / 1.3 (CKV_AZURE_190) — restrict blob public access at the
          # account level. Pair with `public_network_access_enabled = false` for full coverage.
          allow_nested_items_to_be_public = false
        }
      verification_step: |
        After `terraform apply`, run `az storage account show --name <n> --resource-group <rg> --query "allowBlobPublicAccess"`
        and confirm `false`. Re-run `checkov --check CKV_AZURE_190` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account"
  CKV_AZURE_199:
    - resource_type: azurerm_servicebus_namespace
      current_problem: "Ensure that Azure Service Bus uses double encryption"
      remediation_hcl: |
        resource "azurerm_servicebus_namespace" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          sku                 = "Premium"

          # PCI 3.5.1 (CKV_AZURE_199) — infrastructure-level double encryption.
          # azurerm 4.x: infrastructure_encryption_enabled is a top-level attribute on
          # Premium SKUs only.
          infrastructure_encryption_enabled = true
        }
      verification_step: |
        After `terraform apply`, run `terraform plan` and confirm no diff on
        `infrastructure_encryption_enabled`. Re-run `checkov --check CKV_AZURE_199`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/servicebus_namespace"
  CKV_AZURE_201:
    - resource_type: azurerm_servicebus_namespace
      current_problem: "Ensure that Azure Service Bus uses a customer-managed key to encrypt data"
      remediation_hcl: |
        resource "azurerm_servicebus_namespace" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          sku                 = "Premium"

          identity {
            type = "SystemAssigned"
          }

          # PCI 3.5.1 (CKV_AZURE_201) — customer-managed key for Service Bus data encryption.
          # Requires `customer_managed_key {}` block on the namespace resource.
          customer_managed_key {
            key_vault_key_id          = var.cmk_key_vault_key_id
            user_assigned_identity_id = azurerm_user_assigned_identity.example.id
            identity {
              type         = "UserAssigned"
              identity_ids = [azurerm_user_assigned_identity.example.id]
            }
          }
        }
      verification_step: |
        After `terraform apply`, run `terraform plan` and confirm no diff on
        the `customer_managed_key` block. In the Portal, Service Bus Namespace ->
        Properties -> Encryption should show the configured KV key URI.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/servicebus_namespace"
  CKV_AZURE_202:
    - resource_type: azurerm_servicebus_namespace
      current_problem: "Ensure that Managed identity provider is enabled for Azure Service Bus"
      remediation_hcl: |
        resource "azurerm_servicebus_namespace" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          sku                 = "Premium"

          # PCI 7.2.1 / 8.6 (CKV_AZURE_202) — managed identity is a prerequisite for
          # AAD-based authentication on Service Bus.
          identity {
            type = "SystemAssigned"
          }
        }
      verification_step: |
        After `terraform apply`, run `az servicebus namespace show --name <n> --resource-group <rg> --query "identity"`
        and confirm `type: SystemAssigned, principalId: <guid>`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/servicebus_namespace"
  CKV_AZURE_203:
    - resource_type: azurerm_servicebus_namespace
      current_problem: "Ensure Azure Service Bus Local Authentication is disabled"
      remediation_hcl: |
        resource "azurerm_servicebus_namespace" "example" {
          name                = var.name
          location            = var.location
          resource_group_name = var.resource_group_name
          sku                 = "Premium"

          identity { type = "SystemAssigned" }

          # PCI 7.2.1 / 8.6 (CKV_AZURE_203) — disable SAS key / local auth; require AAD.
          local_auth_enabled = false
        }
      verification_step: |
        After `terraform apply`, run `az servicebus namespace show --name <n> --resource-group <rg> --query "disableLocalAuth"`
        and confirm `true`.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/servicebus_namespace"
