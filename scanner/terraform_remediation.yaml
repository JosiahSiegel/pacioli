          # Also enable container soft-delete for full coverage. The graph check
          # is satisfied when `blob_properties.delete_retention_policy.days > 0`
          # OR the block exists, and `account_kind` is not FileStorage.
          blob_properties {
            delete_retention_policy {
              days = 7  # default is 7; set explicitly for clarity
            }

            container_delete_retention_policy {
              days = 7
            }
          }
        }
      verification_step: |
        After `terraform apply`, run `az storage account blob-service-properties show --account-name <n> --resource-group <rg> --query "{blob: deleteRetentionPolicy.allowPermanentDelete, container: containerDeleteRetentionPolicy.enabled}"`
        and confirm both policies enabled. Re-run `checkov --check CKV2_AZURE_38 --framework terraform` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account"
  CKV2_AZURE_40:
    - resource_type: azurerm_storage_account
      current_problem: "Ensure storage account is not configured with Shared Key authorization"
      remediation_hcl: |
        resource "azurerm_storage_account" "example" {
          name                     = var.name
          resource_group_name      = var.resource_group_name
          location                 = var.location
          account_tier             = "Standard"
          account_replication_type = "LRS"

          # PCI 7.2 / 8.6 (CKV2_AZURE_40) — disable Shared Key (account key) auth.
          # Default is `true`. After this, callers MUST use Azure AD auth
          # (managed identity, service principal, OAuth) — not access keys.
          # Note: this also satisfies CKV2_AZURE_41 (SAS expiration) automatically.
          shared_access_key_enabled = false
        }
      verification_step: |
        After `terraform apply`, run `az storage account show --name <n> --resource-group <rg> --query "allowSharedKeyAccess"`
        and confirm `false`. Re-run `checkov --check CKV2_AZURE_40 --check CKV2_AZURE_41 --framework terraform`
        and expect 0 findings on this resource.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account"
  CKV2_AZURE_41:
    - resource_type: azurerm_storage_account
      current_problem: "Ensure storage account is configured with SAS expiration policy"
      remediation_hcl: |
        resource "azurerm_storage_account" "example" {
          name                     = var.name
          resource_group_name      = var.resource_group_name
          location                 = var.location
          account_tier             = "Standard"
          account_replication_type = "LRS"

          # PCI 8.3 (CKV2_AZURE_41) — CKV2_AZURE_41 passes when EITHER:
          #   (a) shared_access_key_enabled = false (preferred — see CKV2_AZURE_40), OR
          #   (b) shared_access_key_enabled = true AND sas_policy.expiration_period is set.
          # We recommend (a) and only fall back to (b) for legacy migrations.
          shared_access_key_enabled = true  # set to false to also pass CKV2_AZURE_40

          # DD.HH:MM:SS format — 90 days here.
          sas_policy {
            expiration_period = "90.00:00:00"
            expiration_action = "Log"  # or "Block" for stricter enforcement
          }
        }
      verification_step: |
        After `terraform apply`, run `az storage account show --name <n> --resource-group <rg> --query "sasPolicy.expirationPeriod"`
        and confirm non-empty. Re-run `checkov --check CKV2_AZURE_41 --framework terraform` and expect 0 findings.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account"
  CKV_SECRET_3:
    - resource_type: azurerm_storage_account
      current_problem: "Azure Storage Account access key"
      remediation_hcl: |
        # CKV_SECRET_3 — Azure Storage Account access key detected in source.
        # NO Terraform azurerm 4.x remediation applies; this is a secret-scanner
        # finding under --framework secrets (gitleaks / detect-secrets).
        #
        # Operator remediation steps (manual, not HCL):
        #   1. Remove the leaked key from the .tf / .tfvars / .env file. If the
        #      file is in git history, rotate immediately and consider BFG / git
        #      filter-repo to purge history (see docs/runbooks/secret-leak.md).
        #   2. Rotate the key in Azure:
        #        az storage account keys renew --account-name <n> --key primary
        #   3. Switch the data plane to Managed Identity / Entra auth so future
        #      .tf files NEVER embed a Shared Key. Set
        #      `shared_access_key_enabled = false` (CKV2_AZURE_40) on the
        #      `azurerm_storage_account` and use `azurerm_role_assignment`
        #      against the data-plane RBAC roles ("Storage Blob Data Reader" etc).
        #   4. If the value MUST remain in IaC for a one-off bootstrap, store
        #      it in Azure Key Vault (azurerm_key_vault_secret) and read it via
        #      `data.azurerm_key_vault_secret` with a `lifecycle { ignore_changes }`
        #      on the access_key field.
      verification_step: |
        No `terraform apply`. After removing the secret:
          1. `grep -r "<leaked-prefix>" .` should return 0 hits.
          2. `checkov --framework secrets --check CKV_SECRET_3` should return 0 findings.
          3. `az storage account keys list --account-name <n> --query "[].keyName"` should
             show only the post-rotation key value, never the leaked one.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account"
  CKV_SECRET_6:
    - resource_type: azurerm_key_vault
      current_problem: "Base64 High Entropy String"
      remediation_hcl: |
        # CKV_SECRET_6 — Base64 High Entropy String detected by detect-secrets.
        # NO Terraform azurerm 4.x remediation applies; this is a secret-scanner
        # finding under --framework secrets.
        #
        # Base64 high-entropy matches flag any long base64-looking string as a
        # potential credential. Common false positives: certificate PEM blocks,
        # SSH public keys, terraform state blobs. Common true positives: API
        # tokens, OAuth refresh tokens, basic-auth strings.
        #
        # Operator remediation steps:
        #   1. Identify the secret: which credential is it? (Storage key? Twilio?
        #      GitHub PAT? Generic API token?) — see docs/runbooks/secret-leak.md.
        #   2. Remove the literal from the file. If it was a real credential, rotate
        #      it at the issuing provider (az storage account keys renew, etc.).
        #   3. Move the secret to Azure Key Vault (`azurerm_key_vault_secret`) and
        #      reference via `data.azurerm_key_vault_secret`. For service-to-service
        #      auth, prefer Managed Identity (`azurerm_user_assigned_identity` +
        #      `azurerm_role_assignment`) over any static credential.
        #   4. For false positives (e.g., PEM public keys), add a Checkov suppression:
        #        checkov:skip=CKV_SECRET_6:Reason for skipping
        #      inline on the same line as the match. Document in the baseline file
        #      (.scripts/checkov/secret_baseline.yaml) if your team uses one.
      verification_step: |
        No `terraform apply`. After removing the secret:
          1. `checkov --framework secrets --check CKV_SECRET_6` should return 0 findings
             (or only intentional suppressions).
          2. For false positives, confirm the inline `checkov:skip=CKV_SECRET_6:<reason>`
             comment is on the EXACT line of the match (not the line before/after).
          3. For real credentials, confirm the rotation completed at the issuing provider
             BEFORE the old value stops being trusted.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/key_vault"
  CKV_SECRET_18:
    - resource_type: azurerm_function_app
      current_problem: "Twilio API Key"
      remediation_hcl: |
        # CKV_SECRET_18 — Twilio API Key (AccountSID:AuthToken or API Key SID:Secret)
        # detected in source. NO Terraform azurerm 4.x remediation applies; this is
        # a secret-scanner finding under --framework secrets.
        #
        # Operator remediation steps:
        #   1. Remove the leaked Twilio credential from the .tf / .tfvars / .env file.
        #      If it was a real Auth Token or API Key, rotate it IMMEDIATELY in the
        #      Twilio Console (Account -> API keys & tokens -> Rotate / Revoke).
        #   2. Move the Twilio credential to Azure Key Vault
        #      (`azurerm_key_vault_secret`) and have the consumer (Function App /
        #      Logic App) read it via `data.azurerm_key_vault_secret`. For Function
        #      Apps, set the value via an app setting reference (Key Vault reference
        #      pattern) so the secret never lives in plaintext .tf.
        #   3. If the Function App calls Twilio, prefer Managed Identity + Twilio's
        #      OAuth flow where supported. Otherwise use a runtime-loaded env var:
        #        azurerm_function_app.example.app_settings["TWILIO_AUTH_TOKEN"]
        #          = "@Microsoft.KeyVault(SecretUri=${azurerm_key_vault_secret.twilio.versionless_id})"
        #   4. Add the Twilio credential domain to the gitleaks baseline ONLY if you
        #      have confirmed it is a fixture / test value (never commit real creds,
        #      even with a baseline exclusion).
      verification_step: |
        No `terraform apply`. After removing the secret:
          1. `checkov --framework secrets --check CKV_SECRET_18` should return 0 findings.
          2. In the Twilio Console, confirm the old Auth Token / API Key shows
             "Revoked" or "Rotated" status.
          3. If the Function App was the consumer, restart it
             (`az functionapp restart --name <n> --resource-group <rg>`) so it picks
             up the new Key Vault-referenced secret value.
      provenance: "https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/linux_function_app"
  CKV_TF_1:
    - resource_type: module
      current_problem: "Ensure Terraform module sources use a commit hash"
      remediation_hcl: |
        # CKV_TF_1 — Terraform module `source` is missing a `?ref=<commit-hash>` pin.
        # Checkov's regex requires `?ref=` followed by a 5-40 char hex string.
        # Pinning to a tag like `?ref=v1.2.3` does NOT pass — must be a commit hash.

        module "network" {
          # BEFORE (fails CKV_TF_1):
          #   source = "git@github.com:myorg/terraform-modules.git//network"
          #
          # AFTER (passes):
          source = "git@github.com:myorg/terraform-modules.git//network?ref=a1b2c3d4e5f6"
          # ^ 10+ char hex SHA. Resolve from `git rev-parse HEAD` in the module repo.
        }

        # Local (./ or ../) paths are NOT evaluated by CKV_TF_1 — they return
        # UNKNOWN, not FAILED. No change needed for local modules.
      verification_step: |
        No `terraform apply` unless you intend to roll the module forward.
        After updating the `source` URL:
          1. `terraform init -upgrade` so the new ref is fetched and locked in .terraform.lock.hcl.
          2. `terraform plan` and confirm no unintended module-version drift.
          3. `checkov --check CKV_TF_1 --framework terraform` should return 0 findings.
        # If you pinned to a tag (NOT recommended): use `?ref=vX.Y.Z` and accept that
        # CKV_TF_1 will still fail because tags are not hex hashes. Convert to SHA.
      provenance: "https://developer.hashicorp.com/terraform/language/modules/sources"
