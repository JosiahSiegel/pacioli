name: release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/attach (e.g. v0.2.0). Default: derive from trigger context.'
        required: false
        default: ''
        type: string
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip==25.2 build==1.5.0
          python -m build --wheel --sdist --outdir ./dist
      - name: Attest build provenance (wheel)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.whl
          push-to-registry: false
      - name: Attest build provenance (sdist)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.tar.gz
          push-to-registry: false
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
