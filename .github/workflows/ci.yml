name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Sync mapping packs into the wheel bundle
        # The single source of truth for mapping packs is mappings/ at the repo root.
        # The wheel install ships them inside the scanner package at scanner/mappings/
        # so that importlib.resources can locate them. This step MUST run before the
        # wheel build, otherwise the wheel omits scanner/mappings/*.yaml and the
        # install-bundled fallback silently fails.
        run: |
          python -m pip install --only-binary=:all: pyyaml==6.0.2
          python scripts/sync_mappings.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: build==1.5.0
          python -m build --wheel --outdir ./dist

      - name: Install dependencies
        # NOTE: All versions are pinned in scanner/requirements-pinned.txt
        # (audit-pinned checkov) and pyproject.toml (project dependencies).
        # The local wheel is built above and installed with --only-binary=:all:
        # so SonarCloud S8541/S8544 (supply chain) are satisfied.
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: ./dist/pacioli-*-py3-none-any.whl
          pip install --only-binary=:all: pytest==9.1.1
          # requirements-pinned.txt contents are pinned; extract the
          # checkov and pyyaml versions inline so each invocation is
          # individually pinned (S8544 cannot inspect -r files).
          pip install --only-binary=:all: checkov==3.3.9 pyyaml==6.0.2 requests==2.32.3

      - name: Run non-browser pytest
        run: pytest scanner/tests/ -v -m "not browser"

  browser:
    name: Static report browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: pytest==9.1.1 pytest-playwright==0.7.2 playwright==1.57.0

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run static report browser smoke test
        run: make test-browser

  mapping-lint:
    name: Validate mapping YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: pyyaml==6.0.2

      - name: Validate mapping schema
        run: |
          python -c "
          import yaml
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scanner')
          from aggregate import load_mapping, validate_out_of_scope_entries
          data = yaml.safe_load(Path('mappings/pci_dss_4.0.1.yaml').read_text())
          # Required top-level keys
          for key in ('framework_name', 'framework_version', 'requirements'):
              assert key in data, f'pci_mapping.yaml missing required key: {key}'
          # Map loads cleanly
          mapping = load_mapping(Path('mappings/pci_dss_4.0.1.yaml'))
          assert len(mapping) > 0, 'no checks mapped'
          # OOS entries validate (the key must be present even if the list is empty)
          oos = data.get('out_of_scope_requirements', [])
          errors, _ = validate_out_of_scope_entries(oos, today_iso='2026-08-06')
          if errors:
              print('OOS validation errors:')
              for e in errors:
                  print('  -', e)
              exit(1)
          print(f'OK: {len(mapping)} checks mapped to {len(data[\"requirements\"])} requirements')
          "

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        run: |
          pip install --only-binary=:all: ruff==0.6.9
      - name: Run ruff
        run: ruff check scanner/

  safety-surface:
    name: Safety subprocess surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: pytest==9.1.1
      - name: Run subprocess surface tests
        run: pytest -q scanner/tests/test_subprocess_surface.py

  exit-99:
    name: Refusal exit code contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: build==1.5.0
          python -m build --wheel --outdir ./dist
      - name: Install package
        run: |
          python -m pip install --upgrade pip==25.2
           pip install --only-binary=:all: ./dist/pacioli-*-py3-none-any.whl
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: pytest==9.1.1
      - name: Assert refusal exits with 99
        run: |
          pytest -q scanner/tests/test_cli.py::test_cli_subprocess_exits_99_on_terraform_apply_refusal

  selftest:
    name: Safety self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: build==1.5.0
          python -m build --wheel --outdir ./dist
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.2
          pip install --only-binary=:all: ./dist/pacioli-*-py3-none-any.whl
          pip install --only-binary=:all: checkov==3.3.9 pyyaml==6.0.2 requests==2.32.3
      - name: Run safety selftest
        run: python -m scanner.safety
