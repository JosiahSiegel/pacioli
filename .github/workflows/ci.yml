name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install of the local package requires building from
          # source (pip cannot install a local path as a wheel). That is
          # intentional and limited to the checked-in repo, not an index.
          # noqa: S8541
          # Version pinning for this package and its transitive deps lives
          # in pyproject.toml (project deps) and scanner/requirements-pinned.txt
          # (audit-pinned Checkov); re-pinning here would drift from those
          # sources of truth.
          # noqa: S8544
          pip install -e .
          # Checkov is needed for the orchestrator's audit-pin enforcement.
          # Install pinned version so the runtime checkov.__version__ guard is satisfied.
          pip install -r scanner/requirements-pinned.txt
          # pytest is a build-time dependency (CI runs the test suite);
          # install with --only-binary=:all: to avoid running setup.py
          # from source against an untrusted index.
          # pytest version is pinned in pyproject.toml's [project.optional-dependencies].
          # noqa: S8544
          pip install --only-binary=:all: pytest

      - name: Run pytest
        run: pytest

  mapping-lint:
    name: Validate mapping YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PyYAML version is pinned via scanner/requirements-pinned.txt.
          # The mapping-lint job uses a single pinned dep set; no re-pin here
          # to avoid drift from the pinned-requirements source of truth.
          # noqa: S8544
          pip install pyyaml

      - name: Validate mapping schema
        run: |
          python -c "
          import yaml
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scanner')
          from aggregate import load_pci_mapping, validate_out_of_scope_entries
          data = yaml.safe_load(Path('mappings/pci_dss_4.0.1.yaml').read_text())
          # Required top-level keys
          for key in ('framework_name', 'framework_version', 'requirements'):
              assert key in data, f'pci_mapping.yaml missing required key: {key}'
          # Map loads cleanly
          mapping = load_pci_mapping(Path('mappings/pci_dss_4.0.1.yaml'))
          assert len(mapping) > 0, 'no checks mapped'
          # OOS entries validate (the key must be present even if the list is empty)
          oos = data.get('out_of_scope_requirements', [])
          errors, _ = validate_out_of_scope_entries(oos, today_iso='2026-08-06')
          if errors:
              print('OOS validation errors:')
              for e in errors:
                  print('  -', e)
              exit(1)
          print(f'OK: {len(mapping)} checks mapped to {len(data[\"requirements\"])} requirements')
          "
